name: Deploy Android App

on:
  # push:
  #   branches: [ main ]
  #   paths:
  #     - 'app/**'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        working-directory: app/Dropblog
        run: dotnet restore -p:TargetFrameworks=net11.0-android

      - name: Build Android APK
        working-directory: app/Dropblog
        run: dotnet build -c Release -f net11.0-android -p:TargetFrameworks=net11.0-android

      - name: Create Release APK
        working-directory: app/Dropblog
        run: dotnet publish -c Release -f net11.0-android -p:TargetFrameworks=net11.0-android -o ./publish

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: app/Dropblog/publish/de.code_ix.dropblog-Signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 