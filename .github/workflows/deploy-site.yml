name: Deploy Web Site

# Deploys site/ to Strato with the shared CI/CD user (rsync over SSH).
# The domain target is <REMOTE_ROOT>/wwwroot; everything else lives in <REMOTE_ROOT>/private,
# including the server-only private/config.local.php.

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy-web:
    runs-on: ubuntu-latest

    env:
      APP_DIR: site
      SSHPASS: ${{ secrets.STRATO_SSH_PASS }}
      SSH_HOST: ${{ vars.STRATO_SSH_HOST }}
      SSH_TARGET: ${{ vars.STRATO_SSH_USER }}@${{ vars.STRATO_SSH_HOST }}
      REMOTE_ROOT: dropblog.de

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP and Composer (same version as Strato)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer

      - name: Install PHP dependencies
        working-directory: ${{ env.APP_DIR }}/private
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Check PHP syntax
        working-directory: ${{ env.APP_DIR }}
        run: find wwwroot private/src private/views -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Prepare publish directory
        run: |
          mkdir -p publish
          rsync -a \
            --exclude='/.ddev' \
            --exclude='/private/tests' \
            --exclude='/private/phpunit.xml' \
            --exclude='/private/.phpunit.cache' \
            --exclude='/private/composer.*' \
            --exclude='/private/config.local.php' \
            --exclude='/private/config.local.example.php' \
            $APP_DIR/ ./publish/
          echo "${{ github.sha }}" > publish/private/version.txt

      - name: Prepare SSH
        run: |
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # private/config.local.php lives only on the server and must survive --delete.
      - name: Upload
        run: sshpass -e rsync -az --delete --mkpath --exclude '/private/config.local.php' publish/ "$SSH_TARGET:$REMOTE_ROOT/"

      - name: Trigger Update Script
        run: |
          echo "Triggering database update..."

          response=$(curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_API_KEY }}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            "${{ vars.BLOG_URL }}/admin/update")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -ne 200 ]; then
            echo "Error: Update request failed with HTTP code $http_code"
            exit 1
          fi

          if ! echo "$body" | jq -e . >/dev/null 2>&1; then
            echo "Error: Invalid JSON response"
            exit 1
          fi

          if ! echo "$body" | jq -e '.success == true' >/dev/null 2>&1; then
            error_msg=$(echo "$body" | jq -r '.message // "Unknown error"')
            echo "Error: Update failed - $error_msg"
            exit 1
          fi

          if echo "$body" | jq -e '.results | length > 0' >/dev/null 2>&1; then
            echo "Applied migrations:"
            echo "$body" | jq -r '.results[] | "  - \(.file): \(.status)"'
          else
            echo "No new migrations to apply"
          fi

          echo "Update completed successfully"
